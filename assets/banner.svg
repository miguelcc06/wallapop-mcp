<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">wallapop-mcp</title>
  <desc id="desc">A modern banner showing a Wallapop price trend chart connected to market tools.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121318"/>
      <stop offset="1" stop-color="#222630"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C7FF4A"/>
      <stop offset="1" stop-color="#71E6FF"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#ink)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <circle cx="1110" cy="80" r="180" fill="#71E6FF" opacity=".06"/>
  <circle cx="30" cy="360" r="190" fill="#C7FF4A" opacity=".055"/>

  <!-- Price trend card -->
  <g transform="translate(62 98)" filter="url(#shadow)">
    <rect width="284" height="204" rx="14" fill="#F4F2EA"/>
    <path d="M0 14A14 14 0 0 1 14 0h256a14 14 0 0 1 14 14v22H0z" fill="#DCDAD2"/>
    <circle cx="18" cy="18" r="4" fill="#FF6B6B"/>
    <circle cx="32" cy="18" r="4" fill="#F7C948"/>
    <circle cx="46" cy="18" r="4" fill="#52D273"/>
    <!-- chart -->
    <rect x="18" y="56" width="248" height="132" rx="8" fill="#17191F"/>
    <line x1="34" y1="156" x2="250" y2="156" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/>
    <path d="M34 150 L90 128 L140 138 L196 100 L250 74" stroke="#71E6FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 150 L90 128 L140 138 L196 100 L250 74 L250 156 L34 156 Z" fill="#71E6FF" opacity=".12"/>
    <circle cx="90" cy="128" r="6" fill="#C7FF4A"/>
    <circle cx="196" cy="100" r="6" fill="#71E6FF"/>
    <circle cx="250" cy="74" r="6" fill="#FF8066"/>
    <rect x="34" y="82" width="84" height="26" rx="13" fill="#C7FF4A"/>
    <text x="76" y="100" text-anchor="middle" fill="#14161B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800">129 EUR</text>
  </g>

  <!-- Connector -->
  <path d="M366 200H422" stroke="url(#signal)" stroke-width="3" stroke-dasharray="5 7"/>
  <circle cx="422" cy="200" r="5" fill="#C7FF4A"/>

  <!-- Identity -->
  <g transform="translate(456 118)">
    <rect width="55" height="24" rx="12" fill="#C7FF4A"/>
    <text x="27.5" y="16" text-anchor="middle" fill="#14161B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800">MCP</text>
    <text x="0" y="76" fill="#F7F7F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-2.2">wallapop</text>
    <text x="0" y="111" fill="#A7ACB8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="500">Inteligencia de mercado sobre Wallapop para tus agentes.</text>
    <g transform="translate(0 139)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
      <rect width="175" height="30" rx="15" fill="#FFFFFF" opacity=".08"/>
      <text x="87.5" y="20" text-anchor="middle" fill="#D9DCE3">PRECIOS + METRICAS</text>
      <rect x="188" width="112" height="30" rx="15" fill="#FFFFFF" opacity=".08"/>
      <text x="244" y="20" text-anchor="middle" fill="#D9DCE3">WATCHLIST</text>
    </g>
  </g>

  <!-- Retrieval mark -->
  <g transform="translate(1052 200)">
    <circle r="54" fill="none" stroke="#FFFFFF" stroke-opacity=".11"/>
    <circle cy="-29" r="10" fill="#C7FF4A"/>
    <circle cx="-30" cy="22" r="10" fill="#71E6FF"/>
    <circle cx="30" cy="22" r="10" fill="#FF8066"/>
    <path d="M0-19L-24 14M0-19L24 14M-20 22h40" fill="none" stroke="#F7F7F2" stroke-width="3"/>
    <circle r="8" fill="#F7F7F2"/>
  </g>

  <rect x="24" y="372" width="1152" height="2" rx="1" fill="url(#signal)" opacity=".8"/>
</svg>