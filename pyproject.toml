[project]
name = "wallapop-intel"
version = "0.1.0"
description = "Servidor MCP de inteligencia de mercado para Wallapop (solo lectura)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wallapop-intel" }]
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wallapop-intel = "wallapop_intel.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
